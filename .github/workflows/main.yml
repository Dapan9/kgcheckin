name: main
on:
  workflow_dispatch:
  # push:
  schedule:
  - cron: '10 16 * * *'
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        
      - name: 创建node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json
          
      - name: 🔧 检查GitHub CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
          fi
          gh --version
          
      - name: Cache node_modules in api directory
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: ./api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
            
      - name: 安装依赖
        run: npm run install
        if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        
      - name: 签到
        id: signin
        run: |
          if npm run main; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=签到成功 ✅" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=签到失败 ❌" >> $GITHUB_OUTPUT
          fi
        env:
          USERINFO: ${{ secrets.USERINFO }}
          PAT: ${{ secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        continue-on-error: true
        
      # ========== 使用 leafney/dingtalk-action @ v1 ==========
      - name: 钉钉签到通知
        if: always()
        uses: leafney/dingtalk-action@v1
        env:
          DINGTALK_ACCESS_TOKEN: ${{ secrets.DINGTALK_ACCESS_TOKEN }}  # 注意：这里是 Token，不是完整 URL
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        with:
          msgtype: markdown
          title: '签到通知'
          text: |
            ## 📢 签到通知
            
            ### ${{ steps.signin.outputs.message }}
            
            **签到时间**: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
            
            **仓库**: ${{ github.repository }}
            
            **运行详情**: [查看Actions日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ---
            *通知由 GitHub Actions 自动发送*
