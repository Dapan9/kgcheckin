name: main
on:
  workflow_dispatch:
  # push:
  schedule:
  - cron: '10 16 * * *'
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        
      - name: 创建node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json
          
      - name: 🔧 检查GitHub CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
          fi
          gh --version
          
      - name: Cache node_modules in api directory
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: ./api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
            
      - name: 安装依赖
        run: npm run install
        if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        
      - name: 签到
        id: signin
        run: |
          if npm run main; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=签到成功 ✅" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=签到失败 ❌" >> $GITHUB_OUTPUT
          fi
        env:
          USERINFO: ${{ secrets.USERINFO }}
          PAT: ${{ secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        continue-on-error: true
        
      - name: 钉钉签到通知
        if: always()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          # 获取当前北京时间
          CURRENT_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          # 获取签到状态
          SIGN_STATUS="${{ steps.signin.outputs.message }}"
          
          # 生成钉钉签名
          TIMESTAMP=$(date +%s%3N)
          SIGN=$(echo -n "$TIMESTAMP"$'\n'"$DINGTALK_SECRET" | openssl dgst -sha256 -hmac "$DINGTALK_SECRET" -binary | base64)
          # URL编码签名
          SIGN_ENCODED=$(echo -n "$SIGN" | od -An -tx1 | tr ' ' '%' | tr -d '\n')
          
          # 构建消息内容
          MESSAGE=$(cat <<EOF
          {
            "msgtype": "markdown",
            "markdown": {
              "title": "签到通知",
              "text": "## 📢 签到通知\n\n### $SIGN_STATUS\n\n**签到时间**: $CURRENT_TIME\n\n**仓库**: [${{ github.repository }}](${{ github.server_url }}/${{ github.repository }})\n\n**运行详情**: [查看Actions日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n---\n*通知由 GitHub Actions 自动发送*"
            },
            "at": {
              "isAtAll": false
            }
          }
          EOF
          )
          
          # 发送钉钉消息
          RESPONSE=$(curl -s -X POST "$DINGTALK_WEBHOOK&timestamp=$TIMESTAMP&sign=$SIGN_ENCODED" \
            -H "Content-Type: application/json" \
            -d "$MESSAGE")
          
          # 检查响应
          echo "钉钉响应: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"errcode":0'; then
            echo "✅ 钉钉通知发送成功"
          else
            echo "❌ 钉钉通知发送失败"
            exit 1
          fi
